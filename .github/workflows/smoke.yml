name: Smoke Tests

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm install -g pnpm

      - run: pnpm install

      - run: pnpm build

      - run: pnpm dlx playwright install --with-deps

      - run: pnpm exec playwright test --project=chromium
